<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>DTCH Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root{--band:#0D4F8B;--band-2:#0A4378;--card:#FFFFFF;--text:#132030;--sub:#55677A;--line:#DFE6EE;--field:#F4F7FA;--brand:#0D4F8B;--bad:#C8404F;--bad-soft:#FBE4E7}
@media (prefers-color-scheme: dark){:root{--band:#0A2B4B;--band-2:#08243F;--card:#111E2B;--text:#E5ECF3;--sub:#9DAEC0;--line:#223446;--field:#182838;--brand:#4A9BDA;--bad:#F07482;--bad-soft:#3A1C22;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--band)}
body{font-family:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));background:radial-gradient(1200px 600px at 85% -10%,rgba(255,255,255,.08),transparent 60%),var(--band)}
.card{width:100%;max-width:380px;background:var(--card);border-radius:14px;padding:32px 28px 28px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.logo{display:block;width:120px;height:auto;margin:0 0 22px}
h1{margin:0;font-size:20px;font-weight:700}
p.s{margin:4px 0 22px;color:var(--sub);font-size:13px}
label{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:500;margin:0 0 6px}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:15px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin:0 0 16px}
input:focus{outline:2px solid var(--brand);outline-offset:1px}
.rem{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin:-2px 0 20px;text-transform:none;letter-spacing:0;font-weight:400}
button{width:100%;font:inherit;font-weight:500;font-size:15px;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:12px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{background:var(--bad-soft);color:var(--bad);font-size:13px;border-radius:8px;padding:10px 12px;margin:0 0 16px}
[hidden]{display:none!important}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tob64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function keyBits(u,p){
  const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(u.trim().toLowerCase()+':'+p),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(D.salt),iterations:D.iter,hash:'SHA-256'},m,256);
}
async function open_(bits){
  const k=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},k,b64(D.ct));
  return new TextDecoder().decode(pt);
}
function show(html){try{sessionStorage.setItem('dtch_in','1')}catch(e){}
  const go=()=>{document.open();document.write(html);document.close()};
  if(document.readyState==='complete')setTimeout(go,0);else window.addEventListener('load',()=>setTimeout(go,0),{once:true});
}
(async()=>{
  let saved=null;try{saved=localStorage.getItem('dtch_k')}catch(e){}
  if(saved){document.getElementById('f').style.visibility='hidden';try{show(await open_(b64(saved)));return}catch(e){document.getElementById('f').style.visibility='';try{localStorage.removeItem('dtch_k')}catch(_){}}}
  document.getElementById('u').focus();
})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('b'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='Bezig…';err.hidden=true;
  try{
    const bits=await keyBits(document.getElementById('u').value,document.getElementById('p').value);
    const html=await open_(bits);
    if(document.getElementById('r').checked){try{localStorage.setItem('dtch_k',tob64(bits))}catch(_){}}
    show(html);
  }catch(x){err.hidden=false;btn.disabled=false;btn.textContent='Inloggen';document.getElementById('p').select()}
});
</script>
