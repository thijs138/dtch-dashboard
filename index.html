<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>DTCH Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: vaste blauwe zijbalk (merkband) + werkvlak met datumbalk; op mobiel wordt de zijbalk een topbalk met scrollende tabs */
:root{
  --bg:#F4F7FA; --surface:#FFFFFF; --surface-2:#EDF2F7; --line:#DFE6EE;
  --text:#132030; --sub:#55677A; --muted:#8696A7;
  --brand:#0D4F8B; --brand-2:#006BA6; --brand-soft:#DDEBF7; --brand-ink:#0B3F70;
  --band:#0D4F8B; --band-2:#0A4378; --band-text:#FFFFFF; --band-sub:rgba(255,255,255,.68);
  --good:#1E8556; --good-soft:#DFF3E9; --bad:#C8404F; --bad-soft:#FBE4E7; --warn:#B7790A; --warn-soft:#FBF0DA;
  --c1:#0D4F8B; --c2:#3D8FD1; --c3:#8CC3EC; --c4:#E07A5F; --c5:#E9B44C; --c6:#5E9C8F; --c7:#9A8BD1; --c8:#B9C4CF;
  --font:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --rs:6px;
  --shadow:0 1px 2px rgba(16,42,70,.06),0 1px 1px rgba(16,42,70,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1520; --surface:#111E2B; --surface-2:#182838; --line:#223446;
  --text:#E5ECF3; --sub:#9DAEC0; --muted:#6C8095;
  --brand:#6AB0EA; --brand-2:#4A9BDA; --brand-soft:#16324D; --brand-ink:#A9D2F5;
  --band:#0A2B4B; --band-2:#08243F; --band-text:#FFFFFF; --band-sub:rgba(255,255,255,.62);
  --good:#4CC28A; --good-soft:#123527; --bad:#F07482; --bad-soft:#3A1C22; --warn:#E6B04A; --warn-soft:#3A2D12;
  --c1:#6AB0EA; --c2:#2F7BBF; --c3:#A9D2F5; --c4:#EE8C72; --c5:#EBC062; --c6:#6FB5A6; --c7:#ADA0E3; --c8:#5B6E81;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1520; --surface:#111E2B; --surface-2:#182838; --line:#223446;
  --text:#E5ECF3; --sub:#9DAEC0; --muted:#6C8095;
  --brand:#6AB0EA; --brand-2:#4A9BDA; --brand-soft:#16324D; --brand-ink:#A9D2F5;
  --band:#0A2B4B; --band-2:#08243F; --band-text:#FFFFFF; --band-sub:rgba(255,255,255,.62);
  --good:#4CC28A; --good-soft:#123527; --bad:#F07482; --bad-soft:#3A1C22; --warn:#E6B04A; --warn-soft:#3A2D12;
  --c1:#6AB0EA; --c2:#2F7BBF; --c3:#A9D2F5; --c4:#EE8C72; --c5:#EBC062; --c6:#6FB5A6; --c7:#ADA0E3; --c8:#5B6E81;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}

/* zijbalk */
.side{background:var(--band);color:var(--band-text);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:28px;padding:24px 16px 20px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.side .logo{display:block;width:118px;height:auto;margin:4px 8px 0}
.side .tag{margin:6px 8px 0;font-size:12px;color:var(--band-sub);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--band-sub);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:rgba(255,255,255,.07);color:var(--band-text)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.14);color:var(--band-text)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--band-sub);padding:0 8px}
.sync{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;box-shadow:0 0 0 3px rgba(233,180,76,.22)}

/* werkvlak */
.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:14px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.dates{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.dates input{border:0;background:transparent;padding:4px 4px;font-variant-numeric:tabular-nums;font-size:13px;min-width:0}
.dates span{color:var(--muted)}
.presets{display:flex;gap:4px;flex-wrap:wrap}
.chip{white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:12.5px;color:var(--sub);cursor:pointer}
.chip:hover{border-color:var(--brand-2);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#08243F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#08243F}}
.bar .spacer{flex:1}
.bfbtn{display:inline-flex;align-items:center;gap:8px;background:#111418;color:#fff;text-decoration:none;border-radius:999px;padding:6px 14px;font-size:12.5px;white-space:nowrap}
.bfbtn b{font-weight:700;letter-spacing:.02em}
.bfbtn span{color:#F2C94C;font-variant-numeric:tabular-nums}
.bfbtn:hover{background:#000}
.bfbtn[aria-current="page"]{outline:2px solid #F2C94C;outline-offset:2px}
.logout-m{display:none}
.bfhero{background:#111418;color:#fff;border-radius:var(--r);padding:24px 26px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.bfhero .big{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bfhero .big small{font-size:16px;font-weight:400;color:#C9CDD3;margin-left:8px}
.bfhero p{margin:6px 0 0;color:#C9CDD3;font-size:13px}
.bfhero .yl{color:#F2C94C}
.bfdates{display:flex;gap:8px;flex-wrap:wrap}
.bfdates span{border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 11px;font-size:12px;color:#E5E7EB;white-space:nowrap}
.bfdates span.on{background:#F2C94C;color:#111418;border-color:#F2C94C;font-weight:700}
.sample{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:5px 10px;border-radius:999px;font-weight:500;white-space:nowrap}

.view{padding-block:28px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px;max-width:1400px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px}
.head h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--sub);font-size:13px}
.grid{display:grid;gap:22px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;min-width:0}
.card h2{margin:0;font-size:14px;font-weight:500}
.card .ch{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.card .ch small{color:var(--muted);font-size:12px}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:500}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi svg{display:block;width:100%;height:34px;margin-top:4px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:500;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.up{color:var(--good);background:var(--good-soft)}
.delta.down{color:var(--bad);background:var(--bad-soft)}
.delta.flat{color:var(--sub);background:var(--surface-2)}

/* doel */
.goal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;align-items:center}
.goal .track{grid-column:1/-1;position:relative;height:12px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.goal .fill{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:999px}
.goal .fc{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--brand) 35%,transparent) 0 4px,transparent 4px 8px);border-radius:999px}
.goal .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55}
.goal .facts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--sub)}
.goal .facts b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.goal .big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.goal .big small{display:block;font-size:12px;font-weight:400;color:var(--muted)}

/* uitloggen */
.logout{align-self:flex-start;background:rgba(255,255,255,.12);border:0;color:var(--band-text);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
.logout:hover{background:rgba(255,255,255,.2)}
/* order opzoeken */
.zform{display:flex;gap:8px;flex-wrap:wrap}
.zform input{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--mono)}
.zform button{font:inherit;font-weight:500;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:0 20px;cursor:pointer}
:root[data-theme="dark"] .zform button{color:#08243F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .zform button{color:#08243F}}
.ohead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;align-items:flex-start}
.ohead .id{font-family:var(--mono);font-size:20px;font-weight:500}
.ohead .meta{color:var(--sub);font-size:13px;margin-top:4px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--surface-2);color:var(--sub)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;padding:0 0 22px 30px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--c2)}
.tl li::after{content:"";position:absolute;left:11px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.good::before{border-color:var(--good)} .tl li.warn::before{border-color:var(--warn)} .tl li.bad::before{border-color:var(--bad)}
.tl .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .h{font-weight:500;margin-top:1px}
.tl .d{color:var(--sub);font-size:13px;margin-top:2px}
.tl .src{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
a.trk{color:var(--brand-2);font-family:var(--mono);font-size:12.5px}
.zlink{background:none;border:0;padding:0;color:var(--brand-2);font-family:var(--mono);font-size:12.5px;cursor:pointer;text-align:left}
/* nav-secties en badges */
.navsec{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--band-sub);opacity:.75;padding:14px 12px 4px}
.navsec:first-child{padding-top:0}
.nbadge{margin-left:auto;background:#E5484D;color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:999px;display:inline-grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
.nbadge.warn{background:#E9A23B;color:#2B1B00}
.alertbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:12px 16px;font-size:13px}
.alertbar a{color:inherit;font-weight:500;margin-left:auto}
.alertbar.warn{background:var(--warn-soft);color:var(--warn)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.ok{color:var(--good)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)}
.hl td{background:color-mix(in srgb,var(--bad-soft) 60%,transparent)}
td .bad,td.bad,.bad-t{color:var(--bad);font-weight:500}
/* kleur & maat */
.heat td.c{text-align:center;font-variant-numeric:tabular-nums;font-size:12.5px;border-radius:4px;padding:10px 6px;border-bottom:2px solid var(--surface)}
.heat th{text-align:center}
.heat th:first-child{text-align:left}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:8px}
.insights{display:flex;flex-wrap:wrap;gap:10px 28px;font-size:13px;color:var(--sub)}
.insights b{color:var(--text);font-weight:500}

/* doelkaart */
.goalc{display:flex;flex-direction:column;gap:14px;padding:20px 22px}
.gtop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 16px}
.gl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:500}
.gnum{margin-top:4px;font-variant-numeric:tabular-nums}
.gnum b{font-size:30px;font-weight:700;letter-spacing:-.015em}
.gnum span{font-size:15px;color:var(--sub)}
.gbadge{font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.gtrack{position:relative;height:14px;background:var(--surface-2);border-radius:999px;margin-bottom:16px}
.gfill{position:absolute;inset:0 auto 0 0;border-radius:999px}
.gmark{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--text)}
.gmark em{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.gmeta{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:13px;color:var(--sub)}
.gmeta b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.gsplit{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px 28px;border-top:1px solid var(--line);padding-top:16px}
.gsub{font-size:13px;font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gsub small{font-weight:400;color:var(--muted);font-size:12px}
.mts{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}
.mt{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:6px;background:var(--surface-2);font-variant-numeric:tabular-nums;min-width:0}
.mt .mn{font-size:11px;color:var(--sub)}
.mt .mp{font-size:12.5px;font-weight:700}
.mt .mg{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mt.hit .mp{color:var(--good)}
.mt.near .mp{color:var(--warn)}
.mt.miss .mp{color:var(--bad)}
.mt.run{background:transparent;outline:1.5px solid var(--brand-2);outline-offset:-1.5px} .mt.run .mp{color:var(--brand-ink)}
.mt.fut .mp{color:var(--muted);font-weight:400}

/* lijsten met balken */
.blist{display:flex;flex-direction:column;gap:16px}
.bi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px}
.bi .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bi .v{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:12.5px}
.bi .v b{font-size:13px}
.gp{font-weight:500;margin-left:6px;color:var(--sub)}.gp.bad{color:var(--bad)}.gp.good{color:var(--good)}
.more{margin-top:14px;border:0;background:none;color:var(--brand-2);font-size:13px;font-weight:500;cursor:pointer;padding:0}
.bi .v b{color:var(--text);font-weight:500}
.bi .t{grid-column:1/-1;height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bi .t i{display:block;height:100%;border-radius:999px}
.bi.click{cursor:pointer;border-radius:6px;padding:4px 6px;margin:-4px -6px}
.bi.click:hover,.bi.sel{background:var(--surface-2)}
.bi.sel .n{font-weight:500}

.chart{position:relative;height:260px}
.card.fill{display:flex;flex-direction:column}
.card.fill .chart{flex:1;min-height:260px}
.chart.tall{height:320px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.dow div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11.5px;color:var(--muted)}
.dow i{display:block;width:100%;max-width:34px;border-radius:4px 4px 2px 2px;background:var(--c3)}
.dow .top i{background:var(--brand)}

/* tabellen */
.tw{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.rank{color:var(--muted);font-variant-numeric:tabular-nums;width:28px}
.pill{display:inline-block;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.new{background:var(--brand-soft);color:var(--brand-ink)}
.pill.shipped{background:var(--good-soft);color:var(--good)}
.pill.cancelled{background:var(--bad-soft);color:var(--bad)}
.mpb{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mpb i{display:none}
tr.order{cursor:pointer}
tr.order:hover td{background:var(--surface-2)}
tr.lines td{background:var(--surface-2);padding:6px 10px 12px}
tr.lines table td{border:0;padding:4px 10px;background:transparent}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;min-width:0}
.filters input{width:240px;max-width:100%}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-size:13px;color:var(--sub);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:500}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .chip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.yoy{font-size:12px}

/* koppeling */
.steps{display:flex;flex-direction:column;gap:14px;counter-reset:s}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}
.step::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.step p{margin:3px 0 0;color:var(--sub)}
pre.code{background:var(--surface-2);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:12.5px;overflow-x:auto;margin:8px 0 0;line-height:1.6}
.note{font-size:12.5px;color:var(--sub);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-2-1{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .gsplit{grid-template-columns:minmax(0,1fr)}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:6;height:auto;flex-direction:row;align-items:center;gap:14px;padding:10px 0 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:0}
  .side .tag,.side .foot{display:none}
  .side .logo{width:76px;margin:0}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;padding-right:16px}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:8px 12px}
  .nav a svg{display:none}
  .navsec{display:none}
  .nbadge{margin-left:6px}
  .bar{top:calc(env(safe-area-inset-top,0px) + 54px)}
  .logout-m:not([hidden]){display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--sub);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
  .logout-m svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bfhero .big{font-size:34px}
  .bar-in,.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .kpi .v{font-size:21px}
  .card{padding:14px 14px}
  .tw{margin:0 -14px;padding:0 14px}
  .presets{overflow-x:auto;flex-wrap:nowrap;width:100%;scrollbar-width:none}
  .sample{display:none}
  .goal{grid-template-columns:minmax(0,1fr)}
  .goal .big{text-align:left}
  .mts{grid-template-columns:repeat(6,minmax(0,1fr))}
  .gnum b{font-size:24px}
  .hide-s,.rank{display:none}
  .head h1{font-size:21px}
}
@media (prefers-reduced-motion:no-preference){.view>*{animation:in .25s ease both}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>
</head>

function alertBar(){
  const sg=signals().filter(x=>x.status==='bad'), late=openOrders().filter(o=>NOWT-o.orderT>=48).length;
  const parts=[];
  if(sg.length)parts.push(sg.map(x=>`<b>${x.n}</b>: geen orders sinds ${fmtT(x.last.orderT)}`).join(' · '));
  if(late)parts.push(`<b>${late}</b> orders wachten langer dan 48 uur op verzending`);
  if(!parts.length)return '';
  return `<div class="alertbar"><span>⚠ ${parts.join(' · ')}</span><a href="#${sg.length?'signalen':'verzending'}">Bekijken →</a></div>`;
}
function kpi(l,v,d,s,sp){return `<section class="card kpi"><div class="row"><span class="l">${l}</span>${d}</div><div class="v">${v}</div><div class="s">${s}</div>${sp?spark(sp):''}</section>`}
let sigCache=null;
function signals(){
  if(sigCache)return sigCache;
  const rate=MP.map(()=>Array(24).fill(0)), days=28;
  for(let i=TI-days;i<TI;i++)for(const o of genDay(i))rate[o.mp][Math.floor(o.orderT%24)]+=1/days;
  const res=MP.map((x,k)=>{
    let last=null;
    for(let i=TI;i>=TI-14&&!last;i--){for(const o of genDay(i)){if(o.mp===k){last=o;break}}}
    const lastT=last?last.orderT:NOWT-14*24, gap=NOWT-lastT;
    let exp=0;for(let t=Math.floor(lastT);t<NOWT;t++){const part=Math.min(t+1,NOWT)-Math.max(t,lastT);if(part>0)exp+=rate[k][((t%24)+24)%24]*part}
    let todayN=0;for(const o of genDay(TI))if(o.mp===k)todayN++;
    let todayExp=0;for(let hh=0;hh<NOW_FRAC*24;hh++)todayExp+=rate[k][hh]*Math.min(1,NOW_FRAC*24-hh);
    const daily=[];for(let i=TI-13;i<=TI;i++)daily.push(genDay(i).filter(o=>o.mp===k).length);
    const status=exp>=5&&gap>=2?'bad':exp>=3&&gap>=2?'warn':'ok';
    return {k,n:x.n,last,gap,exp,todayN,todayExp,daily,status,perDay:rate[k].reduce((a,b)=>a+b,0)};
  });
  return sigCache=res;
}

function fmtT(t){const d=Math.floor(t/24),hh=t%24;return (d===TI?'vandaag':d===TI-1?'gisteren':dfmt(iso(d)))+' '+String(Math.floor(hh)).padStart(2,'0')+':'+String(Math.floor((hh%1)*60)).padStart(2,'0')}
function openOrders(){const out=[];for(let i=TI-21;i<=TI;i++)for(const o of genDay(i))if(o.status==='new')out.push(o);return out.sort((a,b)=>a.orderT-b.orderT)}

function goalSum(from,to,partialToday){
  const a=idx(from),b=idx(to);let g=0;

function periodEnd(){
  const d=new Date(TI*DAY),y=d.getUTCFullYear(),m=d.getUTCMonth(),e=(Y,M,D)=>new Date(Date.UTC(Y,M,D)).toISOString().slice(0,10);

function goalInfo(R){

  const col=ok?'var(--good)':pace>=.95?'var(--warn)':'var(--bad)';
  const fill=Math.min(1,R.rev/full), mark=running?Math.min(1,now/full):1;
  // maanden 2026
  const M=monthly(), cm=+TODAY.slice(5,7)-1, dimC=new Date(Date.UTC(2026,cm+1,0)).getUTCDate(), fr=(+TODAY.slice(8)-1+NOW_FRAC)/dimC;

    return `<div class="mt ${st}" title="${n}: ${eur0.format(r)} van ${eur0.format(g)} (${lbl})"><span class="mn">${n}</span><span class="mp">${pf.format(p)}</span><span class="mg">${lbl}</span></div>`;
  }).join('');
  // achterstand per marktplaats
  const behind=Object.entries(R.mp).map(([k,v])=>{const g=mpGoal(MP[k].n,S.from,S.to);return g?{n:MP[k].n,k:+k,gap:v.rev-g,p:v.rev/g}:null}).filter(x=>x&&x.gap<0).sort((a,b)=>a.gap-b.gap).slice(0,4);
  const tot=Object.keys(R.mp).filter(k=>mpGoal(MP[k].n,S.from,S.to)).length;
  return `<section class="card goalc">

    </div>
    <div class="gtrack" role="img" aria-label="${pf.format(R.rev/full)} van het doel">
      <span class="gfill" style="width:${fill*100}%;background:${col}"></span>
      ${running?`<span class="gmark" style="left:${mark*100}%"><em style="${mark>.75?'left:auto;right:0;transform:none':''}">doel t/m vandaag</em></span>`:''}
    </div>
    <div class="gmeta">
      <span>${ok?'Voorsprong':'Achterstand'} t/m vandaag: <b style="color:${col}">${ok?'+':'−'}${eur0.format(Math.abs(gap))}</b></span>

      ${running?`<span>Dagen resterend: <b>${Math.ceil(daysLeft)}</b></span><span>Nodig per dag: <b>${eur0.format(daysLeft>0?left/daysLeft:0)}</b></span><span>Prognose: <b style="color:${prog>=full?'var(--good)':'var(--bad)'}">${eur0.format(prog)}</b></span>`:''}

    if(q&&!(o.id.toLowerCase().includes(q)||o.lines.some(l=>sku(l.p,l.c,l.s).toLowerCase().includes(q)||titleOf(l).toLowerCase().includes(q))))continue;

function bgCalc(){
  const M=monthly(), cm=+TODAY.slice(5,7)-1, dim=new Date(Date.UTC(2026,cm+1,0)).getUTCDate(), frac=(+TODAY.slice(8)-1+NOW_FRAC)/dim;
  const months=S.bgM===''?[...Array(cm+1).keys()]:[+S.bgM];
  const w=m=>m<cm?1:m===cm?frac:0;
  const rows=MP.map((x,i)=>{
    const bud=months.reduce((t,m)=>t+(+budOf(2026,x.n)[m]||0)*w(m),0), real=months.reduce((t,m)=>t+M.mp[2026][i][m],0);
    const ly=months.reduce((t,m)=>t+((M.mp[2025]||[])[i]||[])[m]*(m===cm?frac:1)||t,0);
    const year=budOf(2026,x.n).reduce((a,b)=>a+(+b||0),0);
    return {i,n:x.n,bud,real,ly,year};
  }).sort((a,b)=>b.year-a.year);
  const T=rows.reduce((t,r)=>({bud:t.bud+r.bud,real:t.real+r.real,ly:t.ly+r.ly,year:t.year+r.year}),{bud:0,real:0,ly:0,year:0});
  return {rows,T,cm,frac,months};
}

  const p=T.bud?T.real/T.bud:0, gap=T.real-T.bud;

    ${rows.map(r=>{const q=r.bud?r.real/r.bud:null;return `<tr><td><span class="mpb"><i style="background:${MPCOL(r.i)}"></i>${r.n}</span></td><td class="r hide-s">${eur0.format(r.year)}</td><td class="r">${r.bud?eur0.format(r.bud):'–'}</td><td class="r">${eur0.format(r.real)}</td><td style="min-width:150px">${q==null?'<span class="sub" style="margin:0">nog geen begroting</span>':`<div style="display:flex;align-items:center;gap:8px"><span class="bi" style="flex:1;display:block"><span class="t" style="display:block"><i style="width:${Math.min(1,q)*100}%;background:${q>=1?'var(--good)':q>=.9?'var(--warn)':'var(--bad)'}"></i></span></span><span class="num" style="font-size:12px;width:44px;text-align:right">${pf.format(q)}</span></div>`}</td><td class="r hide-s">${r.ly?eur0.format(r.ly):'–'}</td><td class="r hide-s">${r.ly?delta(r.real,r.ly):'<span class="delta flat">nieuw</span>'}</td></tr>`}).join('')}

function vVerzending(){
  const open=openOrders(), thr=+S.vzThr;
  const late=open.filter(o=>NOWT-o.orderT>=thr&&(S.vzMp===''||o.mp===+S.vzMp));
  const o24=open.filter(o=>NOWT-o.orderT>=24).length, o48=open.filter(o=>NOWT-o.orderT>=48).length;
  const a=idx(S.from), b=Math.min(idx(S.to),TI), per=MP.map(()=>({sh:0,on:0,hrs:0,open:0,o24:0,o48:0}));
  for(let i=a;i<=b;i++)for(const o of genDay(i))if(o.shipT){const d=o.shipT-o.orderT,p=per[o.mp];p.sh++;p.hrs+=d;if(d<=24)p.on++}
  for(const o of open){const p=per[o.mp],h=NOWT-o.orderT;p.open++;if(h>=24)p.o24++;if(h>=48)p.o48++}
  const tot=per.reduce((t,p)=>({sh:t.sh+p.sh,on:t.on+p.on}),{sh:0,on:0}), onRate=tot.sh?tot.on/tot.sh:0;
  const rows=MP.map((x,i)=>({...per[i],n:x.n,i})).filter(r=>r.sh||r.open).sort((x,y)=>y.o24-x.o24||y.open-x.open);
  return `
  <div class="head"><div><h1>Verzending</h1><p>Openstaande orders op dit moment · verzendtijden over ${rangeLabel(S.from,S.to)}</p></div></div>
  <div class="grid g4">

        <div class="seg" role="group" aria-label="Wachttijd">${[24,48,72].map(t=>`<button data-vz="${t}" aria-pressed="${thr===t}">&gt; ${t} uur</button>`).join('')}</div>

      ${late.slice(0,S.vzAll?200:15).map(o=>{const h=NOWT-o.orderT;return `<tr><td><span class="${h>=48?'bad':''}">${ago(h)}</span><span class="sub">${fmtT(o.orderT)}</span></td><td class="mono">${o.id}</td><td>${MP[o.mp].n}</td><td class="hide-s">${esc(titleOf(o.lines[0]))}${o.lines.length>1?`<span class="sub">+${o.lines.length-1} ander product</span>`:''}</td><td class="r">${eur2.format(o.total)}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Geen orders die zo lang wachten</td></tr>'}
      </tbody></table></div>

      ${fams.map(x=>`<tr><td>${esc(x.f)}${hi(x)?'<span class="sub bad-t">Opvallend hoog, check voorraad en levertijd</span>':''}</td><td class="r">${nf.format(x.c)}</td><td class="r ${hi(x)?'bad':''}">${pf.format(x.r)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Geen annuleringen</td></tr>'}

    ${recent.map(o=>`<tr><td class="num">${fmtT(o.orderT)}</td><td class="mono">${o.id}</td><td>${MP[o.mp].n}</td><td class="hide-s">${esc(titleOf(o.lines[0]))}</td><td class="r">${eur2.format(o.total)}</td></tr>`).join('')}

}
function drawAnnuleringen(){

function vRetouren(){
  const a=idx(S.from), b=Math.min(idx(S.to),TI), A=a*24, B=(b+1)*24;
  const R=agg(S.from,S.to), [pa,pb]=prevRange();
  const stats=(A0,B0)=>{const x={ret:0,retO:0,reship:0,refund:0,refundN:0,fam:{},famR:{},mp:{},sku:{}};
    for(let i=Math.floor(A0/24)-45;i<=Math.min(TI,Math.floor(B0/24));i++)for(const o of genDay(i)){
      if(o.ret&&o.ret.t>=A0&&o.ret.t<B0){const l=o.lines[o.ret.li],f=P[l.p].fam,k=sku(l.p,l.c,l.s);x.ret+=o.ret.q;x.retO++;x.fam[f]=(x.fam[f]||0)+o.ret.q;x.mp[o.mp]=(x.mp[o.mp]||0)+o.ret.q;(x.sku[k]||(x.sku[k]={l,n:0})).n+=o.ret.q}
      if(o.reship&&o.reship.t>=A0&&o.reship.t<B0){x.reship++;const f=P[o.lines[o.reship.li].p].fam;x.famR[f]=(x.famR[f]||0)+1}
      if(o.refund&&o.refund.t>=A0&&o.refund.t<B0){x.refund+=o.refund.amt;x.refundN++}
    }return x};
  const X=stats(A,B), Y=stats(idx(pa)*24,(idx(pb)+1)*24), Q=agg(pa,pb);
  const rate=R.items?X.ret/R.items:0, prate=Q.items?Y.ret/Q.items:0;
  const fams=Object.keys(R.fam).map(f=>({f,sold:R.fam[f].q,ret:X.fam[f]||0,rs:X.famR[f]||0})).map(x=>({...x,r:x.sold?x.ret/x.sold:0})).sort((p,q)=>q.ret-p.ret).slice(0,10);
  const mps=Object.keys(R.mp).map(k=>{let sold=0;return {n:MP[k].n,k:+k,ret:X.mp[k]||0}}).sort((p,q)=>q.ret-p.ret);
  const mpSold={};for(let i=a;i<=b;i++)for(const o of genDay(i))if(o.status!=='cancelled')mpSold[o.mp]=(mpSold[o.mp]||0)+o.qty;
  const skus=Object.entries(X.sku).sort((p,q)=>q[1].n-p[1].n).slice(0,8);
  const hi=(r,n)=>r>rate*2&&n>=5;
  return `
  <div class="head"><div><h1>Retouren</h1><p>${rangeLabel(S.from,S.to)} · retouren uit de ZGRU-lijsten, naleveringen uit de Sendungsausgangen, terugbetalingen uit Magento</p></div></div>
  <div class="grid g4">
    ${kpi('Geretourneerd',nf.format(X.ret)+' stuks',delta(X.ret,Y.ret,true),`${nf.format(X.retO)} orders`)}
    ${kpi('Retourpercentage',pf.format(rate),delta(rate,prate,true),'retourstuks t.o.v. verkochte stuks')}
    ${kpi('Terugbetaald',eur0.format(X.refund),delta(X.refund,Y.refund,true),`${nf.format(X.refundN)} terugbetalingen`)}
    ${kpi('Naleveringen',nf.format(X.reship),delta(X.reship,Y.reship,true),'orders met "Nachl." in de Sendungsausgang')}
  </div>
  <div class="grid g2">
    <section class="card"><div class="ch"><h2>Per productlijn</h2><small>rood = meer dan 2× het gemiddelde</small></div>
      <div class="tw"><table><thead><tr><th>Productlijn</th><th class="r">Verkocht</th><th class="r">Retour</th><th class="r">%</th><th class="r hide-s">Nalev.</th></tr></thead><tbody>
      ${fams.map(x=>`<tr><td>${esc(x.f)}</td><td class="r">${nf.format(x.sold)}</td><td class="r">${nf.format(x.ret)}</td><td class="r ${hi(x.r,x.ret)?'bad':''}">${pf.format(x.r)}</td><td class="r hide-s">${x.rs||'–'}</td></tr>`).join('')}
      </tbody></table></div>
    </section>
    <section class="card"><div class="ch"><h2>Per marktplaats</h2></div>
      <div class="tw"><table><thead><tr><th>Marktplaats</th><th class="r">Verkocht</th><th class="r">Retour</th><th class="r">%</th></tr></thead><tbody>
      ${mps.map(x=>{const so=mpSold[x.k]||0,r=so?x.ret/so:0;return `<tr><td>${x.n}</td><td class="r">${nf.format(so)}</td><td class="r">${nf.format(x.ret)}</td><td class="r ${hi(r,x.ret)?'bad':''}">${pf.format(r)}</td></tr>`}).join('')}
      </tbody></table></div>
    </section>
  </div>
  <section class="card"><div class="ch"><h2>Meest geretourneerde artikelen</h2><small>stuks in de periode</small></div>
    <div class="tw"><table><thead><tr><th></th><th>Artikel</th><th class="r">Retour</th></tr></thead><tbody>
    ${skus.map(([k,v],i)=>`<tr><td class="rank">${i+1}</td><td>${esc(titleOf(v.l))}<span class="sub mono">${k}</span></td><td class="r">${v.n}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Geen retouren in deze periode</td></tr>'}
    </tbody></table></div>
    <div class="note" style="margin-top:14px">In de ZGRU-lijst staat geen retourreden. Het percentage is een benadering: retouren in de periode gedeeld door verkochte stuks in dezelfde periode. Een retour hoort vaak bij een order van een paar weken eerder.</div>
  </section>`;
}

function vKoppeling(){
  return `
  <div class="head"><div><h1>Koppelingen</h1><p>Waar de gegevens vandaan komen en wat er nodig is om het dashboard met echte data te vullen</p></div></div>
  <div class="grid g2">
    <section class="card"><div class="ch"><h2>Magento</h2><span class="pill warn">Niet gekoppeld</span></div>
      <div class="steps">
        <div class="step"><div><b>Integratie aanmaken met alleen leesrechten</b><p>In Magento: System → Extensions → Integrations → Add New Integration. Geef alleen toegang tot Sales (orders, verzendingen, creditnota's) en Catalog (producten).</p></div></div>
        <div class="step"><div><b>Token als bearer-token toestaan</b><p>Stores → Configuration → Services → OAuth → Consumer Settings → "Allow OAuth Access Tokens to be used as standalone Bearer tokens".</p></div></div>
        <div class="step"><div><b>Token op de eigen server zetten</b><p>In het configuratiebestand van het dashboard, nooit in de code, op GitHub of in een chat.</p></div></div>
        <div class="step"><div><b>Synchronisatie</b><p>Elk kwartier nieuwe en gewijzigde orders, verzendingen en creditnota's ophalen.</p></div></div>
      </div>
      <div class="tw" style="margin-top:16px"><table><thead><tr><th>Dashboard</th><th>Magento</th></tr></thead><tbody>
        <tr><td>Ordernummer</td><td class="mono">increment_id, ext_order_id</td></tr>
        <tr><td>Marktplaats</td><td>nog te bepalen (store view, betaalmethode of extra veld)</td></tr>
        <tr><td>Datum, land, bedrag</td><td class="mono">created_at, billing_address.country_id, grand_total</td></tr>
        <tr><td>Producten</td><td class="mono">items[] (sku, name, qty_ordered, price_incl_tax)</td></tr>
        <tr><td>Terugbetalingen</td><td class="mono">creditmemos</td></tr>
        <tr><td>Categorie, kleur, maat</td><td>productkenmerken</td></tr>
      </tbody></table></div>
    </section>
    <section class="card"><div class="ch"><h2>Facido-bestanden (mail)</h2><span class="pill warn">Niet gekoppeld</span></div>
      <div class="steps">
        <div class="step"><div><b>Eigen mailbox voor de bestanden</b><p>Bijvoorbeeld rapporten@raamdecoratie.com, met een doorstuurregel voor de Sendungsausgang- en ZGRU-mails. Freshdesk blijft zoals het is.</p></div></div>
        <div class="step"><div><b>Inlezen</b><p>Een script op de eigen server haalt elk kwartier de CSV-bijlagen op, leest ze in en markeert de mail als verwerkt.</p></div></div>
      </div>
      <div class="tw" style="margin-top:16px"><table><thead><tr><th>Bestand</th><th>Wat we gebruiken</th></tr></thead><tbody>
        <tr><td>Sendungsausgang (DESADV)</td><td>ordernummer, verzenddatum, vervoerder, tracking, EAN, SKU, aantal. "Nachl." voor het ordernummer = nalevering</td></tr>
        <tr><td>ZGRU</td><td>retourdocument, ordernummer, besteldatum, retourdatum, SKU, EAN, omschrijving, aantal</td></tr>
      </tbody></table></div>
      <div class="note" style="margin-top:14px">Namen, adressen en telefoonnummers uit deze bestanden worden niet overgenomen in het dashboard.</div>
    </section>
  </div>
  <section class="card"><div class="ch"><h2>Overige bronnen</h2></div>
    <div class="tw"><table><tbody>
      <tr><td>Begroting</td><td>Excel-sjabloon "Begroting dashboard.xlsx", één tabblad per jaar</td></tr>
      <tr><td>Ads, TACOS, marges</td><td>volgt later: advertentiedata en inkoopprijzen</td></tr>
    </tbody></table></div>

/* ================================================================
   RENDER + EVENTS
   ================================================================ */
const VIEWS={overzicht:[vOverzicht,drawOverzicht],categorieen:[vCategorieen],trends:[vTrends,drawTrends],begroting:[vBegroting,drawBegroting],varianten:[vVarianten],zoeken:[vZoeken],retouren:[vRetouren],blackfriday:[vBlackfriday,drawBlackfriday],signalen:[vSignalen],verzending:[vVerzending],annuleringen:[vAnnuleringen,drawAnnuleringen],orders:[vOrders],koppeling:[vKoppeling]};
function render(){
  const v=VIEWS[S.view]||VIEWS.overzicht;
  Object.values(charts).forEach(c=>c.destroy());for(const k in charts)delete charts[k];
  $('view').className='view';$('view').innerHTML=v[0]();
  if(v[1]&&window.Chart)v[1]();
  document.querySelectorAll('#nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===S.view?'page':'false'));
  $('bfbtn').setAttribute('aria-current',S.view==='blackfriday'?'page':'false');
}
function route(){const h=(location.hash||'').slice(1);S.view=VIEWS[h]?h:'overzicht';render()}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-p],[data-cat],[data-m],[data-tc],[data-more],[data-vz],[data-va],[data-zoek],tr.order,#oPrev,#oNext');if(!t)return;
  if(t.dataset.zoek!=null){e.stopPropagation();S.zq=t.dataset.zoek;if(S.view!=='zoeken')location.hash='zoeken';else render();window.scrollTo(0,0);return}
  if(t.dataset.vz){S.vzThr=t.dataset.vz;render();return}
  if(t.dataset.va){S.vaMetric=t.dataset.va;render();return}
  if(t.dataset.more){const k=t.dataset.more;if(k==='mp')S.allMp=!S.allMp;else if(k==='vz')S.vzAll=!S.vzAll;else S.allTop=!S.allTop;render();return}
  if(t.dataset.p){setPreset(t.dataset.p);return}
  if(t.dataset.cat!=null){S.catSel=t.dataset.cat;render();return}
  if(t.dataset.m){S.trMetric=t.dataset.m;render();return}
  if(t.dataset.tc!=null){const c=t.dataset.tc;if(!c)S.trCats.clear();else S.trCats.has(c)?S.trCats.delete(c):S.trCats.add(c);render();return}
  if(t.matches('tr.order')){S.oOpen=S.oOpen===t.dataset.o?null:t.dataset.o;render();return}
  if(t.id==='oPrev'){S.oPage--;render()} if(t.id==='oNext'){S.oPage++;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-cat],tr.order'))e.target.click()});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='df'||id==='dt'){let a=$('df').value,b=$('dt').value;if(!a||!b)return;if(a>b)[a,b]=[b,a];S.from=a<'2025-01-01'?'2025-01-01':a;S.to=b>TODAY?TODAY:b;S.preset='';S.oPage=1;syncDates();render()}
  if(id==='catMp'){S.catMp=e.target.value;render()}
  if(id==='bgM'){S.bgM=e.target.value;render()}
  if(id==='vzMp'){S.vzMp=e.target.value;render()}
  if(id==='vaCat'){S.vaCat=e.target.value;S.vaFam='';render()}
  if(id==='vaFam'){S.vaFam=e.target.value;render()}
  if(id==='oMp'){S.oMp=e.target.value;S.oPage=1;render()}
  if(id==='oSt'){S.oSt=e.target.value;S.oPage=1;render()}
});
let qT;document.addEventListener('input',e=>{if(e.target.id==='oQ'){clearTimeout(qT);qT=setTimeout(()=>{S.oQ=e.target.value;S.oPage=1;render();const el=$('oQ');el.focus();el.setSelectionRange(el.value.length,el.value.length)},250)}});
window.addEventListener('hashchange',route);
document.addEventListener('submit',e=>{if(e.target.id==='zf'){e.preventDefault();S.zq=$('zq').value.trim();render();const z=$('zq');if(z)z.focus()}});
const redraw=()=>{const v=VIEWS[S.view];if(v&&v[1]&&window.Chart)v[1]()};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redraw)}catch(e){}
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

[S.from,S.to]=PRESETS[3][2]();syncDates();route();
try{if(sessionStorage.getItem('dtch_in')||localStorage.getItem('dtch_k')){const out=()=>{try{localStorage.removeItem('dtch_k');sessionStorage.removeItem('dtch_in')}catch(e){}location.reload()};for(const id of ['logout','logoutM']){const lo=$(id);lo.hidden=false;lo.onclick=out}}}catch(e){}
{const d=idx('2026-11-27')-TI;$('bfcount').textContent=d>0?'nog '+d+' dagen':d>=-3?'nu bezig':'';}
(function(){const sg=signals(),b=sg.filter(x=>x.status==='bad').length,w=sg.filter(x=>x.status==='warn').length,el=$('sigBadge');if(b||w){el.textContent=b+w;el.hidden=false;if(!b)el.classList.add('warn')}
const n=openOrders().filter(o=>NOWT-o.orderT>=24).length,e2=$('shipBadge');if(n){e2.textContent=n;e2.hidden=false;e2.classList.add('warn')}})();
</script>
